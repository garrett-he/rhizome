[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "rhizome-extract"
version = "0.1.0"
description = """\
    rhizome 的文件文本抽取 CLI：将文档转换为 Markdown、图片转换为 OCR 文本、\
    音视频转换为 SRT 字幕文本。\
    """
keywords = [ "documents", "extraction", "markdown", "ocr", "srt" ]
license = { text = "MIT" }
maintainers = [ { name = "Garrett HE", email = "garrett.he@outlook.com" } ]
requires-python = ">=3.13"
dependencies = [
    "av<16",
    "beautifulsoup4>=4.15.0",
    "faster-whisper>=1.2.1",
    "filetype>=1.2.0",
    "mammoth>=1.13.0",
    "markdownify>=1.2.3",
    "onnxruntime>=1.31.0",
    "opencc-python-reimplemented>=0.1.7",
    "openpyxl>=3.1.5",
    "pymupdf>=2.0",
    "python-pptx>=1.0.2",
    "rapidocr>=3.10.0",
]

[project.scripts]
rhizome-extract = "rhizome_extract.cli:main"

[dependency-groups]
dev = [
    "nuitka>=2.7",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/rhizome_extract" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]

[tool.ruff]
line-length = 120
target-version = "py313"
src = [ "src", "tests" ]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "SIM" ]

[tool.ruff.lint.per-file-ignores]
# cli.py 需要在导入提取库之前设置 HF 环境变量
"src/rhizome_extract/cli.py" = [ "E402" ]
